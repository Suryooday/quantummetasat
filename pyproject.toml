[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantummeta-sat"
version = "1.0.0"
description = "Meta-Learning Enabled Hybrid Quantum-Classical Neural Networks for Adaptive Channel Estimation in LEO Satellite Communications"
readme = "README.md"
authors = [{ name = "QuantumMeta-Sat Research Team" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pennylane>=0.35.0",
    "pyyaml>=6.0",
    "pytest>=7.3.0",
    "tqdm>=4.65.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
