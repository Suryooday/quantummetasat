# QuantumMeta-Sat Default Configuration
project:
  name: "QuantumMeta-Sat"
  description: "Meta-Learning Enabled Hybrid Quantum-Classical Neural Networks for Adaptive Channel Estimation in LEO Satellite Communications"
  version: "1.0.0"

seed: 42
device: "cpu"  # "cpu" or "cuda" / "mps"

physics:
  earth_radius_m: 6378137.0       # Re in meters (WGS-84)
  satellite_altitude_m: 600000.0  # h = 600 km LEO
  carrier_frequency_hz: 2.0e9     # S-band / L-band carrier (2 GHz)
  speed_of_light: 299792458.0     # c in m/s
  sampling_rate_hz: 1.0e6         # 1 MHz bandwidth / symbol rate
  orbital_velocity_m_s: 7560.0    # Circular LEO orbit ~600km ~7.56 km/s

channel:
  shadowing_environments:
    frequent_heavy:
      b0: 0.063
      m: 0.739
      omega: 8.97e-4
      description: "Heavy Shadowing (dense urban/foliage)"
    average:
      b0: 0.126
      m: 10.1
      omega: 0.835
      description: "Average Shadowing (suburban/light foliage)"
    infrequent_light:
      b0: 0.158
      m: 19.4
      omega: 1.29
      description: "Light Shadowing (open area, rural)"
  default_environment: "average"
  doppler_max_hz: 48000.0         # Max Doppler at ~2GHz LEO pass ~48-50 kHz
  normalize_path_loss_amplitude: true  # Normalized relative to reference zenith path loss for numerical stability

modulation:
  scheme: "QPSK"
  normalized_power: 1.0

data:
  window_size: 9                  # W=9 (9 past IQ pairs = 36 real inputs)
  features_per_symbol: 4          # [Re(x), Im(x), Re(y), Im(y)]
  target_format: "complex_iq"     # [Re(h), Im(h)]
  num_train_tasks: 80
  num_val_tasks: 20
  num_test_tasks: 30
  samples_per_task: 200           # Channel observations per task
  snr_range_train_db: [5.0, 20.0]
  snr_test_list_db: [5.0, 10.0, 15.0, 20.0]
  elevation_range_train_deg: [20.0, 80.0]
  elevation_test_list_deg: [20.0, 30.0, 45.0, 60.0, 75.0, 90.0]

output_dirs:
  data_raw: "data/raw"
  data_processed: "data/processed"
  experiments: "experiments"
  results: "results"
  figures: "figures"
  reports: "reports"
