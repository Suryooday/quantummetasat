# Classical Models Configuration (MLP, CNN, Baseline LS)
mlp:
  input_dim: 36
  hidden_dims: [128, 128]
  output_dim: 2
  activation: "relu"
  dropout: 0.0

cnn:
  input_channels: 4
  sequence_length: 9
  conv_channels: [32, 64]
  kernel_sizes: [3, 3]
  hidden_fc: 64
  output_dim: 2
  activation: "relu"

training:
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 1.0e-5
  epochs: 50
  early_stopping_patience: 10
  lr_scheduler:
    type: "cosine"
    min_lr: 1.0e-5
